<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Merci — Axolotl</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/assets/axolotl-mark.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
:root { --bg:#ffffff; --ink:#0e2e2d; --muted:#4f6260; --pink:#e8708a; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b1817; --ink:#eef3f1; --muted:#a5b8b5; --pink:#f08ba0; color-scheme: dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", system-ui, sans-serif; padding: 40px max(24px, env(safe-area-inset-left, 0px)); box-sizing:border-box; }
main { max-width: 560px; display:grid; gap:20px; }
img { width:72px; height:72px; }
h1 { font-family:"Bricolage Grotesque", system-ui, sans-serif; font-weight:600; font-size: clamp(36px, 6vw, 56px); line-height:1.02; letter-spacing:-.03em; margin:0; }
p { margin:0; font-size:18px; line-height:1.6; color:var(--muted); }
a { color:var(--ink); font-weight:600; text-underline-offset:4px; }
</style>
</head>
<body>
<main>
  <img src="/assets/axolotl-mark.svg" alt="">
  <h1>Merci, votre demande est bien arrivée.</h1>
  <p>Nous vous envoyons le dossier investisseur et vous proposons un appel sous une semaine. Si vous représentez un établissement de santé, nous vous recontactons au sujet du programme pilote.</p>
  <p><a href="/">← Retour à l'accueil</a></p>
</main>
</body>
</html>
